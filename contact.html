<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Eritrea Uncovered</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Eritrea Uncovered</h1>
  </header>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Eritrea</a></li>
      <li><a href="destinations.html">Destinations</a></li>

      <li><a href="travel-planning.html">Travel Planning</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
  <main>
    <section id="contact">
      <h2>Contact Us</h2>
      <p>Plan your trip to Eritrea. Send us your details and we will get back to you.</p>
      <form id="contactForm" onsubmit="return validateForm()">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name">

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com">

        <label for="age">Age</label>
        <input type="number" id="age" name="age" min="1" max="120" placeholder="Your age">

        <label for="destination">Destination of Interest</label>
        <select id="destination" name="destination">
          <option value="">Choose a destination</option>
          <option value="asmara">Asmara</option>
          <option value="massawa">Massawa</option>
          <option value="dahlak">Dahlak Islands</option>
          <option value="qohaito">Qohaito</option>
          <option value="filfil">Filfil and Selam</option>
        </select>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" placeholder="Tell us about your travel plans"></textarea>

        <button type="submit">Send</button>
      </form>
      <p id="formError"></p>
    </section>
  </main>
  <footer>
    <p>&copy; 2026 Eritrea Uncovered. All rights reserved.</p>
  </footer>
  <script src="js/script.js"></script>
</body>
</html>
